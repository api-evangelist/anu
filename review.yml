  - date: '2026-08-19'
    rating: 3
    method: probed
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles the OPERATOR of
      each surface before saving anything. The June 2026 review was accurate but incomplete:
      it found two surfaces where there are six, and it did not ask who runs them. Three
      material findings. (1) ANU's research portal, researchportalplus.anu.edu.au, is an
      ELSEVIER PURE TENANCY — it CNAMEs to anu2-portal.elsevierpure.com and returns
      "x-product: Pure Portal". It is recorded as x-operator: tenant and no Pure specification
      is saved here; ANU's data, Elsevier's contract. (2) ANU operates a Shibboleth identity
      provider publishing machine-readable SAML 2.0 metadata at idp2.anu.edu.au, registered in
      the Australian Access Federation and interfederated via eduGAIN. This is the single
      largest previously-uncatalogued institution-operated surface in the profile. (3) The
      legacy QRNG endpoint signals its one-request-per-minute throttle with HTTP 200 and a
      plain-text sentence, not 429 and not JSON — the previously recorded rate-limit artifact
      asserted 429 and has been corrected. ANU publishes no OpenAPI for anything; every spec
      in openapi/ is derived or probed by API Evangelist and marked as such. NCI and the
      student-built timetable.cssa.club were deliberately NOT claimed as ANU surfaces.
    endpoints:
