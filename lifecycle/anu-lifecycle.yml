note: >-
  ANU publishes one genuine, dated deprecation notice — on the QRNG@ANU legacy endpoint —
  and nothing else resembling lifecycle governance. There is no changelog, no versioning
  policy, no status page and no SLA on any institution-operated surface. The deprecation
  notice is real and worth crediting; it is also unusually weak, because it names no sunset
  date and the deprecated endpoint emits no Deprecation or Sunset header.
