x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Five institution-operated surfaces and one tenant relationship were settled by live probe
    on 2026-08-19, before anything was saved. The operator axis is the whole finding here:
    ANU's research portal is an Elsevier Pure tenancy and is recorded as `tenant`, never as an
    ANU contract. The surfaces that ARE ANU's are small — two quantum RNG endpoints (one
    deprecated), an OAI-PMH provider, a DSpace REST API and a SAML identity provider — and
    none of them ships an OpenAPI, so every spec in openapi/ is marked `derived` or `probed`
    and attributed to API Evangelist, not to ANU. Deliberate exclusions, each with a reason:
    NCI (nci.org.au) is a national facility ANU collaborates in rather than operates, so its
    HPC surfaces are not claimed here; timetable.cssa.club is a student-built scrape on a
    non-institutional domain with no endorsement found on ANU's own timetabling pages, so it
    is not credited even as a tenant; Wattle (Moodle) and the library discovery layer are
    behind authentication and are cited only as conformance evidence, not listed as consumable
    APIs. Absences confirmed by negative probe rather than assumed: no developer portal, no
    API gateway, no OIDC discovery, no llms.txt, no security.txt, no status page, no changelog.
  generated: '2026-08-19'
  method: probed
  evidence:
    - url: https://api.quantumnumbers.anu.edu.au/?length=4&type=uint8
      status: 403
      note: Live AWS gateway, rejects without x-api-key. Institution-operated surface confirmed.
    - url: https://qrng.anu.edu.au/API/jsonI.php?length=4&type=uint8
      status: 200
      note: Returned {"type":"uint8","length":4,"data":[74,205,98,159],"success":true}.
    - url: https://openresearch-repository.anu.edu.au/server/oai/request?verb=Identify
      status: 200
      note: OAI-PMH 2.0, repositoryName "Open Research", 12 metadata formats.
    - url: https://openresearch-repository.anu.edu.au/server/api
      status: 200
      note: application/hal+json, dspaceVersion "DSpace 7.6.7", self-hosted on ANU IP 130.56.67.40.
    - url: https://idp2.anu.edu.au/idp/shibboleth
      status: 200
      note: SAML 2.0 IdP metadata, entityID https://idp2.anu.edu.au/idp/shibboleth, scope anu.edu.au.
    - url: https://md.aaf.edu.au/aaf-metadata.xml
      status: 200
      note: Three ANU entityIDs present in the Australian Access Federation aggregate.
    - url: https://researchportalplus.anu.edu.au/
      status: 200
      note: 'TENANT. CNAME anu2-portal.elsevierpure.com; response header x-product: Pure Portal.'
    - url: https://wattlecourses.anu.edu.au/mod/lti/certs.php
      status: 200
      note: Live LTI 1.3 JWKS on ANU's self-hosted Moodle.
    - url: https://api.datacite.org/prefixes/10.25911
      status: 200
      note: ANU DataCite provider `anu`, client `anu.repo`, 25,559 DOIs.
    - url: https://api.anu.edu.au/
      status: 000
      note: Negative probe. No central API gateway; host does not resolve.
    - url: https://developer.anu.edu.au/
      status: 000
      note: Negative probe. No developer portal; host does not resolve.
    - url: https://www.anu.edu.au/llms.txt
      status: 404
      note: Negative probe. No agent-directed content policy.
    - url: https://www.anu.edu.au/.well-known/security.txt
      status: 404
      note: Negative probe. No RFC 9116 security contact.
    - url: https://www.anu.edu.au/.well-known/openid-configuration
      status: 404
      note: Negative probe. No OIDC discovery document.
    - url: https://services.anu.edu.au/information-technology/it-service-status
      status: 404
      note: Negative probe. No status page found on the IT services portal.
apis:
- aid: anu:openresearch-rest
  name: ANU Open Research DSpace REST API
  description: >-
    The HAL+JSON REST API of ANU's self-hosted DSpace 7.6.7 repository, reachable anonymously at /server/api
    for the root and discovery resources; /server/api/core/items returns 401, so the surface is genuinely
    access-controlled rather than uniformly open. Recorded as an ANU-operated surface because ANU runs
    the instance on its own infrastructure, but no specification is saved for it: the contract shape is
    DSpace's upstream design, not ANU engineering, and saving a generic DSpace spec under an institution's
    slug is precisely the misattribution this profile exists to avoid.
  humanURL: https://openresearch-repository.anu.edu.au/
  baseURL: https://openresearch-repository.anu.edu.au/server/api
  tags:
  - Repository
  - REST
  - HAL
  - DSpace
  - Research
  x-operator: institution
  x-operator-evidence: >-
    Self-hosted open-source software on ANU infrastructure under ANU's domain. Contract design is upstream
    DSpace's; no spec saved here for that reason.
  properties:
  - type: Documentation
    url: https://openresearch-repository.anu.edu.au/server/api
- aid: anu:identity-federation
  name: ANU Shibboleth Identity Provider (SAML 2.0 metadata)
  description: >-
    ANU's institutional identity provider, publishing machine-readable SAML 2.0 metadata at a stable URL.
    entityID https://idp2.anu.edu.au/idp/shibboleth, shibmd:Scope anu.edu.au, OrganizationDisplayName
    "Australian National University", with SSO endpoints for HTTP-POST, HTTP-Redirect and SOAP/ECP bindings
    plus a SOAP artifact resolution service and an attribute authority. Registered in the Australian Access
    Federation aggregate (359 entities) alongside two ANU service providers, wattlecourses.anu.edu.au
    and mdl-stage.anu.edu.au, and interfederated internationally through eduGAIN. This is institution-operated
    by definition and is the most consequential machine-readable surface ANU runs — it is also the class
    of surface that is almost never catalogued.
  humanURL: https://services.anu.edu.au/information-technology
  baseURL: https://idp2.anu.edu.au/idp/shibboleth
  tags:
  - Identity Federation
  - SAML
  - Shibboleth
  - AAF
  - eduGAIN
  - Single Sign-On
  x-operator: institution
  x-operator-evidence: >-
    Metadata is served from an anu.edu.au host and self-asserts ANU as the organization. Present in the
    AAF federation aggregate under ANU's own entityID.
  x-developer-usable: false
  x-developer-note: >-
    An end-user login federation, not a developer authorization surface. There is no client registration
    path, no token endpoint and no consent screen an outside developer could integrate against.
  properties:
  - type: Examples
    url: examples/anu-idp-saml-entity-descriptor-example.xml
  - type: Conformance
    url: conformance/anu-conformance.yml
  - type: Federation
    url: https://md.aaf.edu.au/aaf-metadata.xml
- aid: anu:research-portal-pure
  name: ANU Research Portal Plus (Elsevier Pure) — TENANT
  description: >-
    ANU's research information portal and public researcher/output profiles, running on Elsevier Pure.
    This is a genuine institutional fact and one of the few programmable research surfaces ANU has, so
    the relationship is recorded — but it is recorded as a TENANCY, not as an ANU API. The data is ANU's;
    the contract, the API design, the Pure Web Service and the Fingerprint Engine are Elsevier's. No Pure
    specification is saved in this repository and none of Elsevier's engineering is scored as ANU's. Probed:
    the conventional Pure web-service path /ws/api returns 404 on this deployment, so no publicly reachable
    Pure API is exposed here even for the tenant.
  humanURL: https://researchportalplus.anu.edu.au/
  baseURL: https://researchportalplus.anu.edu.au/
  tags:
  - Research Information
  - Elsevier Pure
  - Tenant
  - Research Outputs
  x-operator: tenant
  x-operator-evidence: >-
    researchportalplus.anu.edu.au CNAMEs to anu2-portal.elsevierpure.com -> apac.prod.elsevierpure.com.
    Response header "x-product: Pure Portal". Page markup cites Elsevier Fingerprint Engine and elsevier.responsibledisclosure.com.
  x-vendor: Elsevier Pure
  properties:
  - type: Website
    url: https://researchportalplus.anu.edu.au/
