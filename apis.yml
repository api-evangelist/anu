aid: anu
name: Australian National University
x-type: university
x-category: Public Research University
description: >-
  The Australian National University (ANU) is a public research university in Canberra and a
  member of the Group of Eight, ranked #27 in the QS World University Rankings order used by
  this cohort. Like almost every university, ANU is a federation of buyers rather than an API
  producer: it operates no central developer portal, no institutional API gateway
  (api.anu.edu.au and developer.anu.edu.au do not resolve), and publishes no OpenAPI for
  anything. What it does operate is small, real and genuinely its own — the ANU Quantum
  Numbers (AQN) service serving live quantum random numbers from the ANU Quantum Optics
  group, a deprecated predecessor endpoint at qrng.anu.edu.au throttled to one request per
  minute, a self-hosted DSpace 7.6.7 institutional repository exposing a conformant OAI-PMH
  2.0 interface across twelve metadata formats plus a HAL+JSON REST API, and a Shibboleth
  identity provider registered in the Australian Access Federation and interfederated through
  eduGAIN. ANU is a DataCite member in its own right, holding DOI prefix 10.25911 with 25,559
  registered DOIs. Its research information portal, by contrast, is an Elsevier Pure tenancy
  (researchportalplus.anu.edu.au CNAMEs to elsevierpure.com) — ANU's data on Elsevier's
  contract, recorded here as a tenant relationship and deliberately not credited as ANU
  engineering. Course, timetable and student systems are gated; the widely used ANU timetable
  tool is student-built by the Computer Science Students' Association on a non-ANU domain and
  is not endorsed on ANU's own timetabling pages.
